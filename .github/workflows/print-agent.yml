name: Cross-platform print agent
on: [push, pull_request]
jobs:
  agent:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s print-agent -p test_agent.py
